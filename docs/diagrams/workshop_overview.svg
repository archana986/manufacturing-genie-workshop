  <rect x="1330" y="258" width="492" height="140" rx="12" fill="#00A972" filter="url(#shadow)"/>
  <text x="1576" y="312" text-anchor="middle" class="cardTitleWhite">Databricks Asset Bundle</text>
  <text x="1576" y="350" text-anchor="middle" class="bodyWhite">Agent, jobs, pipeline, app, grants</text>

  <rect x="1330" y="422" width="492" height="120" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
