<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3139" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:700 48px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .subtitle{font:400 22px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .section{font:700 24px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .step{font:700 22px 'DM Sans',Arial,sans-serif;fill:#fff}
      .cardTitleWhite{font:700 26px 'DM Sans',Arial,sans-serif;fill:#fff}
      .cardTitle{font:700 22px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .bodyWhite{font:400 18px 'DM Sans',Arial,sans-serif;fill:#fff}
      .body{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .label{font:700 14px 'DM Sans',Arial,sans-serif;fill:#FF3621;letter-spacing:1.4px}
      .footer{font:400 18px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="12" fill="#FF3621"/>
  <text x="78" y="78" class="title">Apex Genie workshop</text>
  <text x="78" y="116" class="subtitle">Three self-contained levels. Same fictional Apex model. Stop after any level. Later levels reuse Unity Catalog tables and the curated agent.</text>

  <rect x="64" y="156" width="560" height="720" rx="20" fill="#F8F7F5" stroke="#DDD9D2" stroke-width="2"/>
  <rect x="680" y="156" width="560" height="720" rx="20" fill="#EFF6FB" stroke="#B7D4EA" stroke-width="2"/>
  <rect x="1296" y="156" width="560" height="720" rx="20" fill="#EFF9F5" stroke="#A8DCC7" stroke-width="2"/>

  <circle cx="104" cy="208" r="24" fill="#1B3139"/><text x="104" y="216" text-anchor="middle" class="step">1</text>
  <text x="142" y="218" class="section">FOUNDATIONS  /  2 HOURS</text>
  <circle cx="720" cy="208" r="24" fill="#2272B4"/><text x="720" y="216" text-anchor="middle" class="step">2</text>
