  <text x="1576" y="612" text-anchor="middle" class="cardTitle">Who</text>
  <text x="1576" y="648" text-anchor="middle" class="body">Platform and center of excellence</text>

  <rect x="1330" y="710" width="492" height="120" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1576" y="756" text-anchor="middle" class="label">LEAVE WITH</text>
