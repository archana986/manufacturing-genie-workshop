  <rect x="64" y="900" width="1792" height="120" rx="16" fill="#1B3139"/>
  <text x="960" y="948" text-anchor="middle" class="cardTitleWhite">Shared Apex model in Unity Catalog</text>
  <text x="960" y="986" text-anchor="middle" class="bodyWhite">Synthetic plants, lines, quality, and telemetry. Parameterized catalog and schema. No customer data in this repo.</text>
