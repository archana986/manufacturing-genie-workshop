<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3139" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B3139"/>
    </marker>
    <marker id="dashArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5A6F77"/>
    </marker>
    <style>
      .title{font:700 48px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .subtitle{font:400 22px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .section{font:700 22px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .step{font:700 20px 'DM Sans',Arial,sans-serif;fill:#fff}
      .cardTitle{font:700 22px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .cardTitleWhite{font:700 22px 'DM Sans',Arial,sans-serif;fill:#fff}
      .body{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .bodyWhite{font:400 17px 'DM Sans',Arial,sans-serif;fill:#fff}
      .label{font:700 14px 'DM Sans',Arial,sans-serif;fill:#FF3621;letter-spacing:1.4px}
      .line{fill:none;stroke:#1B3139;stroke-width:4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#5A6F77;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#dashArrow)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="12" fill="#FF3621"/>
  <text x="78" y="78" class="title">Level 3  /  Production bundle</text>
  <text x="78" y="116" class="subtitle">Full day. Copy this folder. CI deploys dev. A person promotes staging and prod. Auto-Optimize is optional.</text>

  <rect x="56" y="156" width="420" height="700" rx="20" fill="#F8F7F5" stroke="#DDD9D2" stroke-width="2"/>
  <text x="88" y="208" class="section">BUNDLE (dev)</text>
  <rect x="88" y="236" width="356" height="100" rx="12" fill="#1B3139" filter="url(#shadow)"/>
  <text x="266" y="278" text-anchor="middle" class="cardTitleWhite">Gold pipeline</text>
  <text x="266" y="310" text-anchor="middle" class="bodyWhite">fct_line_shift + work orders</text>
  <path d="M266 336 L266 368" class="line"/>
  <rect x="88" y="372" width="356" height="100" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="266" y="414" text-anchor="middle" class="cardTitle">Deploy metric views</text>
  <text x="266" y="448" text-anchor="middle" class="body">Job after gold exists</text>
  <path d="M266 472 L266 504" class="line"/>
  <rect x="88" y="508" width="356" height="100" rx="12" fill="#2272B4" filter="url(#shadow)"/>
  <text x="266" y="550" text-anchor="middle" class="cardTitleWhite">Genie space</text>
  <text x="266" y="584" text-anchor="middle" class="bodyWhite">Sorted tables, 32-hex ids</text>
  <path d="M266 608 L266 640" class="line"/>
  <rect x="88" y="644" width="356" height="172" rx="12" fill="#00A972" filter="url(#shadow)"/>
  <text x="266" y="700" text-anchor="middle" class="cardTitleWhite">Ask + Test Lab app</text>
  <text x="266" y="736" text-anchor="middle" class="bodyWhite">Jobs, grants, accuracy alert</text>
  <text x="266" y="772" text-anchor="middle" class="bodyWhite">Paused schedule in development</text>

  <rect x="516" y="156" width="680" height="700" rx="20" fill="#EFF6FB" stroke="#B7D4EA" stroke-width="2"/>
  <text x="548" y="208" class="section">HUMAN PATH (default)</text>
  <rect x="548" y="236" width="616" height="96" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="856" y="278" text-anchor="middle" class="cardTitle">1  bundle validate --strict</text>
  <text x="856" y="310" text-anchor="middle" class="body">Catalog, schema, warehouse, workshop_root</text>
  <path d="M856 332 L856 360" class="line"/>
  <rect x="548" y="364" width="616" height="96" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="856" y="406" text-anchor="middle" class="cardTitle">2  Open a pull request</text>
  <text x="856" y="438" text-anchor="middle" class="body">Actions run validate and payload tests</text>
  <path d="M856 460 L856 488" class="line"/>
  <rect x="548" y="492" width="616" height="96" rx="12" fill="#1B3139" filter="url(#shadow)"/>
  <text x="856" y="534" text-anchor="middle" class="cardTitleWhite">3  Merge deploys dev only</text>
  <text x="856" y="566" text-anchor="middle" class="bodyWhite">Nothing writes to prod by itself</text>
  <path d="M856 588 L856 616" class="line"/>
  <rect x="548" y="620" width="616" height="196" rx="12" fill="#FFFFFF" stroke="#FF3621" stroke-width="2" filter="url(#shadow)"/>
  <text x="856" y="680" text-anchor="middle" class="cardTitle">4  PROMOTION.md</text>
  <text x="856" y="720" text-anchor="middle" class="body">A person promotes staging, then prod</text>
  <text x="856" y="756" text-anchor="middle" class="body">Thumbs-down becomes a pull request</text>

  <rect x="1236" y="156" width="628" height="700" rx="20" fill="#FFF8E8" stroke="#EAD9A8" stroke-width="2"/>
  <text x="1268" y="208" class="section">OPTIONAL AUTO-OPTIMIZE</text>
  <rect x="1268" y="236" width="564" height="160" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1550" y="292" text-anchor="middle" class="cardTitle">Needs Prompt Registry</text>
  <text x="1550" y="332" text-anchor="middle" class="body">Workspace Previews, Beta</text>
  <text x="1550" y="364" text-anchor="middle" class="body">Skip the module if the toggle is off</text>
  <path d="M1550 396 L1550 428" class="dash"/>
  <rect x="1268" y="432" width="564" height="160" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1550" y="488" text-anchor="middle" class="cardTitle">Clone, propose, holdout</text>
  <text x="1550" y="528" text-anchor="middle" class="body">Keep a change only if train,</text>
  <text x="1550" y="560" text-anchor="middle" class="body">validation, and holdout all improve</text>
  <path d="M1550 592 L1550 624" class="dash"/>
  <rect x="1268" y="628" width="564" height="184" rx="12" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1550" y="692" text-anchor="middle" class="cardTitle">MaxGenie is archived</text>
  <text x="1550" y="732" text-anchor="middle" class="body">Use Genie Workbench.</text>
  <text x="1550" y="764" text-anchor="middle" class="body">Do not install a second optimizer.</text>

  <rect x="56" y="880" width="1808" height="140" rx="16" fill="#1B3139"/>
  <text x="960" y="936" text-anchor="middle" class="cardTitleWhite">Deploy order: gold pipeline, then metric views, then the Genie space, then the app</text>
  <text x="960" y="976" text-anchor="middle" class="bodyWhite">The space cannot be created until the metric views exist. Replace YOUR_CATALOG.YOUR_SCHEMA in the export JSON per target.</text>
</svg>
