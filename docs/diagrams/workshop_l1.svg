<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3139" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B3139"/>
    </marker>
    <style>
      .title{font:700 48px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .subtitle{font:400 22px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .step{font:700 22px 'DM Sans',Arial,sans-serif;fill:#fff}
      .cardTitle{font:700 22px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .cardTitleWhite{font:700 22px 'DM Sans',Arial,sans-serif;fill:#fff}
      .body{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .bodyWhite{font:400 17px 'DM Sans',Arial,sans-serif;fill:#fff}
      .label{font:700 14px 'DM Sans',Arial,sans-serif;fill:#FF3621;letter-spacing:1.4px}
      .line{fill:none;stroke:#1B3139;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="12" fill="#FF3621"/>
  <text x="78" y="78" class="title">Level 1  /  Foundations</text>
  <text x="78" y="116" class="subtitle">Two hours on serverless. Create a curated Apex agent and get it green on 10 exact benchmarks.</text>

  <rect x="72" y="168" width="280" height="220" rx="16" fill="#1B3139" filter="url(#shadow)"/>
  <circle cx="112" cy="214" r="22" fill="#FF3621"/><text x="112" y="222" text-anchor="middle" class="step">1</text>
  <text x="212" y="270" text-anchor="middle" class="cardTitleWhite">Prereq check</text>
  <text x="212" y="308" text-anchor="middle" class="bodyWhite">Login, SQL, warehouse,</text>
  <text x="212" y="338" text-anchor="middle" class="bodyWhite">serverless, schema grants</text>

  <path d="M352 278 L400 278" class="line"/>

  <rect x="412" y="168" width="280" height="220" rx="16" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="452" cy="214" r="22" fill="#1B3139"/><text x="452" y="222" text-anchor="middle" class="step">2</text>
  <text x="552" y="270" text-anchor="middle" class="cardTitle">Config and data</text>
  <text x="552" y="308" text-anchor="middle" class="body">Catalog, schema, warehouse</text>
  <text x="552" y="338" text-anchor="middle" class="body">Seed Apex tables in UC</text>

  <path d="M692 278 L740 278" class="line"/>

  <rect x="752" y="168" width="280" height="220" rx="16" fill="#2272B4" filter="url(#shadow)"/>
  <circle cx="792" cy="214" r="22" fill="#1B3139"/><text x="792" y="222" text-anchor="middle" class="step">3</text>
  <text x="892" y="270" text-anchor="middle" class="cardTitleWhite">Create the agent</text>
  <text x="892" y="308" text-anchor="middle" class="bodyWhite">Genie UI first, then the</text>
  <text x="892" y="338" text-anchor="middle" class="bodyWhite">blank and curated templates</text>

  <path d="M1032 278 L1080 278" class="line"/>

  <rect x="1092" y="168" width="280" height="220" rx="16" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1132" cy="214" r="22" fill="#1B3139"/><text x="1132" y="222" text-anchor="middle" class="step">4</text>
  <text x="1232" y="270" text-anchor="middle" class="cardTitle">10 benchmarks</text>
  <text x="1232" y="308" text-anchor="middle" class="body">Ground-truth SQL first</text>
  <text x="1232" y="338" text-anchor="middle" class="body">TIMEOUT and ERROR are FAIL</text>

  <path d="M1372 278 L1420 278" class="line"/>

  <rect x="1432" y="168" width="416" height="220" rx="16" fill="#00A972" filter="url(#shadow)"/>
  <circle cx="1472" cy="214" r="22" fill="#1B3139"/><text x="1472" y="222" text-anchor="middle" class="step">5</text>
  <text x="1640" y="270" text-anchor="middle" class="cardTitleWhite">Blank vs curated tests</text>
  <text x="1640" y="308" text-anchor="middle" class="bodyWhite">Conversation API, throttled</text>
  <text x="1640" y="338" text-anchor="middle" class="bodyWhite">Sneaky questions on the curated agent</text>

  <rect x="72" y="440" width="1776" height="520" rx="20" fill="#F8F7F5" stroke="#DDD9D2" stroke-width="2"/>
  <text x="108" y="500" class="label">WHAT THE CLASS PROVES</text>
  <rect x="108" y="536" width="520" height="360" rx="14" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="368" y="600" text-anchor="middle" class="cardTitle">Unity Catalog tables</text>
  <text x="368" y="648" text-anchor="middle" class="body">Plants, lines, operators, events</text>
  <text x="368" y="684" text-anchor="middle" class="body">Quality daily grain, safety, feedback</text>
  <text x="368" y="744" text-anchor="middle" class="body">Parameterized catalog and schema</text>
  <text x="368" y="780" text-anchor="middle" class="body">Synthetic Apex only</text>

  <rect x="668" y="536" width="520" height="360" rx="14" fill="#1B3139" filter="url(#shadow)"/>
  <text x="928" y="600" text-anchor="middle" class="cardTitleWhite">Genie agent</text>
  <text x="928" y="648" text-anchor="middle" class="bodyWhite">Instructions and example SQL</text>
  <text x="928" y="684" text-anchor="middle" class="bodyWhite">Tables attached from Unity Catalog</text>
  <text x="928" y="744" text-anchor="middle" class="bodyWhite">Shift-start briefing in the UI</text>
  <text x="928" y="780" text-anchor="middle" class="bodyWhite">Exact 10-question benchmark set</text>

  <rect x="1228" y="536" width="572" height="360" rx="14" fill="#FFFFFF" stroke="#FF3621" stroke-width="2" filter="url(#shadow)"/>
  <text x="1514" y="600" text-anchor="middle" class="cardTitle">Pass bar</text>
  <text x="1514" y="648" text-anchor="middle" class="body">10 of 10 ground-truth SQL</text>
  <text x="1514" y="684" text-anchor="middle" class="body">Curated agent beats the blank agent</text>
  <text x="1514" y="744" text-anchor="middle" class="body">Optional eval-runs API is Beta</text>
  <text x="1514" y="780" text-anchor="middle" class="body">Use the Benchmarks tab if it is off</text>
</svg>
